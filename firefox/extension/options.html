<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClamAV Download Scanner settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>ClamAV Download Scanner</h1>
    <p class="intro">Choose when Firefox downloads should be checked by ClamAV.</p>
    <label class="setting">
      <input id="automaticScanning" type="checkbox">
      <span>
        <strong>Scan downloads automatically</strong>
        <small>Completed downloads are scanned and detected files are quarantined.</small>
      </span>
    </label>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
