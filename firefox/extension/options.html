<!doctype html>
<html lang="__MSG_locale__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__MSG_settingsTitle__</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>__MSG_settingsHeading__</h1>
    <p class="intro">__MSG_settingsIntro__</p>
    <label class="setting">
      <input id="automaticScanning" type="checkbox">
      <span>
        <strong>__MSG_automaticScanning__</strong>
        <small>__MSG_automaticScanningDescription__</small>
      </span>
    </label>
    <label class="setting">
      <input id="uploadScanning" type="checkbox">
      <span>
        <strong>__MSG_uploadScanning__</strong>
        <small>__MSG_uploadScanningDescription__</small>
      </span>
    </label>
    <label class="setting">
      <input id="cleanNotifications" type="checkbox">
      <span>
        <strong>__MSG_cleanNotifications__</strong>
        <small>__MSG_cleanNotificationsDescription__</small>
      </span>
    </label>
    <label class="setting">
      <span>
        <strong>__MSG_parallelScans__</strong>
        <small>__MSG_parallelScansDescription__</small>
        <input id="nativeWorkers" type="number" min="1" step="1">
      </span>
    </label>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
