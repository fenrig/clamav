<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClamAV Thunderbird settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <h1>ClamAV Thunderbird settings</h1>
      <p>Manage automatic attachment scanning and the local scan-result cache.</p>
    </header>
    <section class="card">
      <h2>Automatic scanning</h2>
      <p class="muted">Choose whether new mail attachments are scanned automatically.</p>
      <label class="field">Mail account <select id="account"></select></label>
      <label class="check"><input id="autoScan" type="checkbox"> <span>Scan attachments automatically when new mail arrives</span></label>
      <label class="check"><input id="diagnosticLogging" type="checkbox"> <span>Enable diagnostic scan logging in the Error Console</span></label>
    </section>
    <section class="card">
      <h2>Scan result cache</h2>
      <p class="muted">Only positive detections are cached by SHA-256; clean and failed scans are never cached.</p>
      <label class="field">Maximum entries <input id="maxEntries" type="number" min="0" step="1"></label>
      <label class="field">Maximum age (days) <input id="maxAgeDays" type="number" min="0" step="1"></label>
    </section>
    <footer><button id="save">Save settings</button> <span id="status" role="status" aria-live="polite"></span></footer>
  </main>
  <script src="options.js"></script>
</body>
</html>
